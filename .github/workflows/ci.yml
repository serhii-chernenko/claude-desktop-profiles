name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax-check zsh scripts
        run: |
          for script in bin/claude-profiles scripts/*.sh install.sh; do
            [ -f "$script" ] || continue
            zsh -n "$script"
            echo "ok $script"
          done

      - name: Build the app (runs the self-test, which does not need Claude.app)
        run: zsh scripts/build-app.sh

      - name: Build the DMG
        run: SKIP_APP_BUILD=1 zsh scripts/build-dmg.sh
