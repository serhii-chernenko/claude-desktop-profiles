name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check that the tag matches the VERSION file
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($file_version)." >&2
            exit 1
          fi

      - name: Syntax-check zsh scripts
        run: |
          for script in bin/claude-profiles scripts/*.sh install.sh; do
            [ -f "$script" ] || continue
            zsh -n "$script"
          done

      - name: Build the app (runs the self-test, which does not need Claude.app)
        run: zsh scripts/build-app.sh

      - name: Build the DMG
        run: SKIP_APP_BUILD=1 zsh scripts/build-dmg.sh
