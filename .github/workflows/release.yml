name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax-check zsh scripts
        run: |
          for script in bin/claude-profiles scripts/*.sh install.sh; do
            [ -f "$script" ] || continue
            zsh -n "$script"
          done

      - name: Build the app (runs the self-test, which does not need Claude.app)
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          zsh scripts/build-app.sh

      - name: Build the DMG
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          SKIP_APP_BUILD=1 zsh scripts/build-dmg.sh

      - name: Create the release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
